name: Update News

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest news
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "malusak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "Update news $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
